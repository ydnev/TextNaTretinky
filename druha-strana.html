<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>Tisk na třetiny A4 - Chytré formátování</title>
    <style>
        body {
            background-color: #abbdda;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* FIXNÍ PANEL S TLAČÍTKY NA LEVÉ STRANĚ */
        .sidebar {
            position: fixed;
            left: 20px;
            top: 20px;
            width: 200px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .main-print-btn {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .redirect-btn {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            background-color: #c5e72c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .main-print-btn:hover {
            background-color: #218838;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .btn-grow {
            background-color: #007bff;
        }

        .btn-grow:hover {
            background-color: #0056b3;
        }

        .btn-shrink {
            background-color: #dc3545;
        }

        .btn-shrink:hover {
            background-color: #c82333;
        }

        .print-hint {
            font-size: 11px;
            color: #555;
            background: #fff8e1;
            border: 1px solid #ffe0a3;
            border-radius: 4px;
            padding: 8px;
            line-height: 1.4;
        }

        .print-hint b {
            color: #7a5b00;
        }

        /* PAPÍR A4 (Uprostřed obrazovky) */
        .page-container {
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left: 240px;
        }

        .a4-page {
            width: 595.27pt;
            height: 841.89pt;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .a4-page:last-child {
            margin-bottom: 0;
        }

        .third {
            height: 280.63pt;
            box-sizing: border-box;
            border-bottom: 1px dashed #bbb;
            padding: 15pt;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .third:last-child {
            border-bottom: none;
        }

        /* Hlavní stylování textu */
        .content {
            width: 100%;
            max-height: 100%;
            outline: none;
            text-align: center;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.3;
        }

        /* KLÍČOVÉ PRAVIDLO: Všechny vnořené elementy (span, strong, p...)
           přinutíme dědit velikost písma a font z hlavní třetiny.
           Pokud vložený text obsahuje cizí inline font-size, toto pravidlo ho přebije. */
        .content * {
            font-size: inherit !important;
            font-family: inherit !important;
            text-align: inherit !important;
        }

        /* PRAVIDLA PRO TISK */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                display: block;
            }

            .sidebar {
                display: none !important;
            }

            .page-container {
                margin: 0;
            }

            .a4-page {
                box-shadow: none;
                width: 595.27pt;
                height: 841.89pt;
                margin: 0;
                page-break-after: always;
                break-after: page;
            }

            .a4-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* Čáry mezi třetinami se nyní PONECHÁVAJÍ i v tisku */
            .third {
                border-bottom: 1px dashed #bbb;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .third:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>

<body>

    <!-- Levý ovládací panel -->
    <div class="sidebar">
        <h3>Pojmy/nadpisy</h3>
        <button class="main-print-btn" onclick="window.print()">Vytisknout / PDF</button>
        <hr style="border: 0; border-top: 1px solid #eee; width: 100%;">

        <div class="control-group">
            <span class="control-label" id="active-label">Aktivní pole: list 1, 1. třetina</span>
            <div class="btn-row">
                <button class="action-btn btn-grow" onclick="changeActiveSize(1)">➕ Zvětšit</button>
                <button class="action-btn btn-shrink" onclick="changeActiveSize(-1)">➖ Zmenšit</button>
            </div>
        </div>

        <div class="print-hint">
            <b>Tip:</b> Adresu / datum v záhlaví a zápatí vypnete v tiskovém okně přepínačem
            "Záhlaví a zápatí" (obvykle v sekci "Další nastavení"). Prohlížeč si tuto volbu
            zpravidla zapamatuje i pro příště.
        </div>
        <button class="redirect-btn" onclick="window.location.href='index.html'">Na texty -> </button>
    </div>

    <!-- Papír A4 (4 listy pod sebou, každý po vytisknutí na samostatné stránce) -->
    <div class="page-container">
        <div class="a4-page">
            <div class="third">
                <div id="p1-txt-1" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p1-txt-2" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p1-txt-3" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
        </div>

        <div class="a4-page">
            <div class="third">
                <div id="p2-txt-1" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p2-txt-2" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p2-txt-3" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
        </div>

        <div class="a4-page">
            <div class="third">
                <div id="p3-txt-1" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p3-txt-2" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p3-txt-3" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
        </div>

        <div class="a4-page">
            <div class="third">
                <div id="p4-txt-1" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p4-txt-2" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
            <div class="third">
                <div id="p4-txt-3" class="content" contenteditable="true" style="font-size: 24pt;">Text</div>
            </div>
        </div>
    </div>

    <script>
        // Sledování naposledy aktivního (naklikaného) editovatelného pole,
        // aby tlačítka Zvětšit/Zmenšit vždy věděla, na co mají sáhnout.
        let activeElement = document.getElementById('p1-txt-1');
        const activeLabel = document.getElementById('active-label');

        const thirdNames = { 1: '1. třetina (nahoře)', 2: '2. třetina (uprostřed)', 3: '3. třetina (dole)' };

        function updateActiveLabel(el) {
            const match = el.id.match(/^p(\d+)-txt-(\d+)$/);
            if (match) {
                activeLabel.textContent = `Aktivní pole: list ${match[1]}, ${thirdNames[match[2]]}`;
            }
        }

        document.querySelectorAll('.content').forEach(el => {
            el.addEventListener('focus', () => {
                activeElement = el;
                updateActiveLabel(el);
            });
            el.addEventListener('click', () => {
                activeElement = el;
                updateActiveLabel(el);
            });
        });

        function changeActiveSize(amount) {
            if (!activeElement) return;
            let currentSize = parseInt(activeElement.style.fontSize, 10) || 24;

            currentSize += amount;

            if (currentSize < 6) currentSize = 6;
            if (currentSize > 120) currentSize = 120;

            activeElement.style.fontSize = currentSize + 'pt';
        }

        // Odstraní mezery/zalomení řádků na úplném začátku a konci obsahu daného
        // elementu (uvnitř textu je nechává beze změny). Prázdné textové uzly
        // na okrajích úplně smaže, aby po nich nezůstávaly "díry".
        function trimEdgesWhitespace(container) {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            let node;
            while ((node = walker.nextNode())) textNodes.push(node);

            // Začátek
            for (const n of textNodes) {
                const trimmed = n.nodeValue.replace(/^[\s\u00A0]+/, '');
                if (trimmed === n.nodeValue) break; // na začátku uzlu nebyla mezera -> konec
                n.nodeValue = trimmed;
                if (n.nodeValue.length > 0) break; // v uzlu zbyl text -> hotovo
                // jinak byl uzel čistě z mezer -> smažeme a jdeme na další
                n.nodeValue = '';
            }

            // Konec (od posledního uzlu zpět)
            for (let i = textNodes.length - 1; i >= 0; i--) {
                const n = textNodes[i];
                const trimmed = n.nodeValue.replace(/[\s\u00A0]+$/, '');
                if (trimmed === n.nodeValue) break;
                n.nodeValue = trimmed;
                if (n.nodeValue.length > 0) break;
                n.nodeValue = '';
            }
        }

        // CHYTRÝ INTEGRÁTOR SCHRÁNKY: Zachová tagy, ale vyčistí velikosti písem
        document.querySelectorAll('.content').forEach(element => {
            element.addEventListener('paste', function (e) {
                e.preventDefault(); // Stop standardnímu vložení

                // Zkusíme vytáhnout formátované HTML, pokud neexistuje, vezmeme prostý text
                let html = (e.clipboardData || window.clipboardData).getData('text/html');

                if (!html) {
                    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                    document.execCommand('insertText', false, text.trim());
                    return;
                }

                // Vytvoříme virtuální DOM element pro pročištění HTML kódu
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;

                // Najdeme všechny vnořené elementy uvnitř vkládaného textu a smažeme jim inline velikosti a fonty
                const allElements = tempDiv.querySelectorAll('*');
                allElements.forEach(el => {
                    el.style.fontSize = ''; // Odstraní inline nastavení velikosti
                    el.style.textAlign = '';
                    el.style.fontFamily = ''; // Odstraní inline nastavení fontu
                    el.style.lineHeight = ''; // Odstraní případné řádkování
                });

                // Ořízneme mezery/zalomení na začátku a konci vkládaného obsahu
                trimEdgesWhitespace(tempDiv);

                // Vložíme pročištěné HTML (které si zachovalo <strong>, <em>, <ul>, atd.) na pozici kurzoru
                document.execCommand('insertHTML', false, tempDiv.innerHTML);
            });
        });
    </script>

</body>

</html>
